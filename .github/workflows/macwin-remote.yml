# macwin-remote — workflow installed by `macwin remote init`.
#
# Two modes:
#   1. **One-shot** (default): downloads the binary uploaded as an ephemeral
#      release, runs it on the matching native runner, captures
#      stdout/stderr/exit, uploads as `macwin-result`. Driven by `macwin run
#      --runner github-actions`.
#   2. **Debug** (`debug=true`): swappable backend × relay model. The release
#      tag carries `macwin-tunnel-runner.exe` (a thin bore-client wrapper)
#      that the runner runs with env vars from `debug_runner_env`. macwin
#      parses the runner's stdout for `MACWIN_TUNNEL_ENDPOINT=<host>:<port>`
#      and SSHes into the runner via that endpoint. Holds open until
#      `C:\macwin-release` appears.
#
# The debug-mode wiring is relay-agnostic: BoreRelay sets MACWIN_TUNNEL_HOST,
# DirectRelay leaves env empty (and uses no tunnel-runner binary), TailscaleRelay
# wires the action separately. The workflow itself only knows "download a
# binary, set env, run, hold open" — the relay choice lives in macwin's config.
#
# Adding a target = adding a job. The `if:` gate routes inputs.target to one
# job at a time.

name: macwin-remote

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Ephemeral release tag carrying the prebuilt binary (one-shot or tunnel-runner)"
        required: false
        default: ""
      target:
        description: "macwin target name"
        required: true
      args:
        description: "Args to forward to the binary (one-shot mode only)"
        required: false
        default: ""
      debug:
        description: "Hold runner open for interactive SSH debug"
        required: false
        default: "false"
      debug_pubkey:
        description: "SSH public key authorized for runneradmin (debug mode)"
        required: false
        default: ""
      debug_runner_args:
        description: "Args macwin-tunnel-runner is invoked with (debug mode)"
        required: false
        default: ""
      debug_runner_env:
        description: "newline-separated KEY=VALUE pairs exported before invoking the tunnel runner"
        required: false
        default: ""

jobs:
  win-arm:
    if: ${{ inputs.target == 'win-arm' }}
    runs-on: windows-11-arm
    timeout-minutes: 30  # safety net so a forgotten debug session can't run forever
    steps:
      # ----- Debug-mode path: install OpenSSH, run tunnel-runner, hold open -----
      - name: Install OpenSSH server (debug)
        if: ${{ inputs.debug == 'true' }}
        shell: pwsh
        run: |
          # Add-WindowsCapability is ~6 minutes on windows-11-arm even when the
          # capability is already installed, so check first and skip if present.
          $cap = Get-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          Write-Host "OpenSSH.Server capability state: $($cap.State)"
          if ($cap.State -ne 'Installed') {
            Write-Host "Installing OpenSSH.Server (this takes ~5 min on first run)..."
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          } else {
            Write-Host "OpenSSH.Server already installed — skipping."
          }
          Set-Service -Name sshd -StartupType Automatic
          Start-Service sshd

          # runneradmin is in Administrators → must use
          # administrators_authorized_keys per Microsoft's OpenSSH config.
          $sshDir = Join-Path $env:ProgramData "ssh"
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          $keyFile = Join-Path $sshDir "administrators_authorized_keys"
          "${{ inputs.debug_pubkey }}" | Out-File -Encoding ASCII -FilePath $keyFile
          icacls $keyFile /inheritance:r /grant "Administrators:F" /grant "SYSTEM:F" | Out-Null
          Write-Host "OpenSSH ready."

      - name: Download tunnel-runner from release (debug)
        if: ${{ inputs.debug == 'true' && inputs.release != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          New-Item -ItemType Directory -Force -Path tunnel | Out-Null
          # The tunnel-runner asset is a Win .exe; the one-shot path uses the
          # same flag pattern, so we filter on filename.
          gh release download "${{ inputs.release }}" --pattern '*macwin-tunnel-runner*.exe' --dir tunnel

      - name: Start tunnel-runner (debug)
        if: ${{ inputs.debug == 'true' && inputs.release != '' }}
        shell: pwsh
        run: |
          # Fan out the env-vars blob into actual env vars.
          $envText = @"
          ${{ inputs.debug_runner_env }}
          "@
          foreach ($line in $envText -split "`n") {
            $line = $line.Trim()
            if ($line -eq "") { continue }
            $eq = $line.IndexOf('=')
            if ($eq -lt 0) { continue }
            $k = $line.Substring(0, $eq)
            $v = $line.Substring($eq + 1)
            [Environment]::SetEnvironmentVariable($k, $v, 'Process')
          }
          # Find the runner binary.
          $exe = Get-ChildItem tunnel\*.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "tunnel-runner exe missing"; exit 1 }
          # Background-launch and capture stdout — the announcement line
          # (MACWIN_TUNNEL_ENDPOINT=...) needs to make it into the workflow log.
          $args = "${{ inputs.debug_runner_args }}"
          Start-Process -FilePath $exe.FullName -ArgumentList $args `
            -PassThru -NoNewWindow -RedirectStandardOutput tunnel-runner.log `
            -RedirectStandardError tunnel-runner.err | Out-Null
          # Wait for the announcement line so macwin's poller can pick it up
          # via gh run view --log without needing a side channel.
          $deadline = (Get-Date).AddMinutes(2)
          while ((Get-Date) -lt $deadline) {
            if (Test-Path tunnel-runner.log) {
              $content = Get-Content tunnel-runner.log -ErrorAction SilentlyContinue
              if ($content -match "MACWIN_TUNNEL_ENDPOINT=") {
                Write-Host ($content -join "`n")
                break
              }
            }
            Start-Sleep -Seconds 2
          }

      - name: Hold runner open (debug)
        if: ${{ inputs.debug == 'true' }}
        shell: pwsh
        run: |
          Write-Host "═══ macwin debug runner ready ═══"
          Write-Host "Waiting for release sentinel at C:\macwin-release..."
          $deadline = (Get-Date).AddMinutes(28)
          while (-not (Test-Path C:\macwin-release)) {
            if ((Get-Date) -gt $deadline) {
              Write-Host "Auto-release after 28 minutes."
              break
            }
            Start-Sleep -Seconds 10
          }
          Write-Host "Releasing runner."

      # ----- One-shot path (debug=false) -----
      - name: Download binary from release
        if: ${{ inputs.debug != 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          gh release download "${{ inputs.release }}" --pattern '*.exe' --dir bin
      - name: Run + capture
        if: ${{ inputs.debug != 'true' }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem bin\*.exe | Select-Object -First 1
          $stdout = "stdout.log"
          $stderr = "stderr.log"
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList "${{ inputs.args }}" `
            -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $proc | Wait-Process
          "exit=$($proc.ExitCode)" | Out-File -FilePath exit.txt
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.debug != 'true' && always() }}
        with:
          name: macwin-result
          path: |
            stdout.log
            stderr.log
            exit.txt

  win-x86:
    if: ${{ inputs.target == 'win-x86' }}
    runs-on: windows-2022
    steps:
      - name: Download binary from release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          gh release download "${{ inputs.release }}" --pattern '*.exe' --dir bin
      - name: Run + capture
        shell: pwsh
        run: |
          $exe = Get-ChildItem bin\*.exe | Select-Object -First 1
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList "${{ inputs.args }}" `
            -PassThru -NoNewWindow -RedirectStandardOutput stdout.log -RedirectStandardError stderr.log
          $proc | Wait-Process
          "exit=$($proc.ExitCode)" | Out-File -FilePath exit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macwin-result
          path: |
            stdout.log
            stderr.log
            exit.txt

  linux-arm:
    if: ${{ inputs.target == 'linux-arm' || inputs.target == 'linux-arm-musl' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download binary from release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p bin
          gh release download "${{ inputs.release }}" --dir bin
      - name: Run + capture
        run: |
          BIN=$(ls bin/* | head -1)
          chmod +x "$BIN"
          "$BIN" ${{ inputs.args }} >stdout.log 2>stderr.log
          echo "exit=$?" > exit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macwin-result
          path: |
            stdout.log
            stderr.log
            exit.txt

  linux-x86:
    if: ${{ inputs.target == 'linux-x86' || inputs.target == 'linux-x86-musl' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download binary from release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p bin
          gh release download "${{ inputs.release }}" --dir bin
      - name: Run + capture
        run: |
          BIN=$(ls bin/* | head -1)
          chmod +x "$BIN"
          "$BIN" ${{ inputs.args }} >stdout.log 2>stderr.log
          echo "exit=$?" > exit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macwin-result
          path: |
            stdout.log
            stderr.log
            exit.txt

  mac-arm:
    if: ${{ inputs.target == 'mac-arm' }}
    runs-on: macos-14
    steps:
      - name: Download binary from release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p bin
          gh release download "${{ inputs.release }}" --dir bin
      - name: Run + capture
        run: |
          BIN=$(ls bin/* | head -1)
          chmod +x "$BIN"
          "$BIN" ${{ inputs.args }} >stdout.log 2>stderr.log
          echo "exit=$?" > exit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macwin-result
          path: |
            stdout.log
            stderr.log
            exit.txt
