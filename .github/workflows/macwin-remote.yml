# macwin-remote — workflow installed by `macwin remote init`.
#
# Two modes:
#   1. **One-shot** (default): downloads the binary uploaded as an ephemeral
#      release, runs it on the matching native runner, captures
#      stdout/stderr/exit, uploads as `macwin-result`. Driven by `macwin run
#      --runner github-actions`.
#   2. **Debug** (`debug=true`): swappable backend × relay model. The release
#      tag carries `macwin-tunnel-runner.exe` (a thin bore-client wrapper)
#      that the runner runs with env vars from `debug_runner_env`. macwin
#      parses the runner's stdout for `MACWIN_TUNNEL_ENDPOINT=<host>:<port>`
#      and SSHes into the runner via that endpoint. Holds open until
#      `C:\macwin-release` appears.
#
# The debug-mode wiring is relay-agnostic: the bore relay sets MACWIN_TUNNEL_HOST
# in `debug_runner_env`. The workflow itself only knows "download a binary, set
# env, run, hold open" — the relay choice lives in macwin's config, so a new
# relay backend needs no workflow change.
#
# Adding a target = adding a job. The `if:` gate routes inputs.target to one
# job at a time.

name: macwin-remote

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Ephemeral release tag carrying the prebuilt binary (one-shot or tunnel-runner)"
        required: false
        default: ""
      target:
        description: "macwin target name"
        required: true
      args:
        description: "Args to forward to the binary (one-shot mode only)"
        required: false
        default: ""
      debug:
        description: "Hold runner open for interactive SSH debug"
        required: false
        default: "false"
      debug_pubkey:
        description: "SSH public key authorized for runneradmin (debug mode)"
        required: false
        default: ""
      debug_runner_args:
        description: "Args macwin-tunnel-runner is invoked with (debug mode)"
        required: false
        default: ""
      debug_runner_env:
        description: "newline-separated KEY=VALUE pairs exported before invoking the tunnel runner (NEVER put secrets here — visible in logs)"
        required: false
        default: ""

jobs:
  win-arm:
    if: ${{ inputs.target == 'win-arm' }}
    runs-on: windows-11-arm
    timeout-minutes: 30  # safety net so a forgotten debug session can't run forever
    steps:
      # In debug mode, check out the source so the SSH'd-in user can
      # build/test/iterate against this repo's code on the runner.
      - name: Checkout source (debug)
        if: ${{ inputs.debug == 'true' }}
        uses: actions/checkout@v4

      # ----- Debug-mode path: download tunnel-runner (which embeds its own
      #       russh-based SSH server + bore client), hold open. No
      #       Add-WindowsCapability dance — macwin owns the entire stack.
      - name: Download tunnel-runner from release (debug)
        if: ${{ inputs.debug == 'true' && inputs.release != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          New-Item -ItemType Directory -Force -Path tunnel | Out-Null
          # The tunnel-runner asset is a Win .exe; the one-shot path uses the
          # same flag pattern, so we filter on filename.
          gh release download "${{ inputs.release }}" --pattern '*macwin-tunnel-runner*.exe' --dir tunnel

      - name: Run tunnel-runner + hold open (debug)
        if: ${{ inputs.debug == 'true' && inputs.release != '' }}
        shell: pwsh
        env:
          # Secret stays in repo secrets, never appears in workflow inputs / logs.
          # GHA automatically masks ${{ secrets.* }} substitutions in the
          # rendered command.
          MACWIN_TUNNEL_SECRET: ${{ secrets.MACWIN_TUNNEL_SECRET }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # MUST be one combined step: GitHub Actions kills child processes
          # spawned in a previous step. Keep the tunnel-runner alive in the
          # SAME powershell that does the hold-open wait.

          # Fan out the env-vars blob into actual env vars for the child.
          $envText = @"
          ${{ inputs.debug_runner_env }}
          "@
          foreach ($line in $envText -split "`n") {
            $line = $line.Trim()
            if ($line -eq "") { continue }
            $eq = $line.IndexOf('=')
            if ($eq -lt 0) { continue }
            $k = $line.Substring(0, $eq)
            $v = $line.Substring($eq + 1)
            [Environment]::SetEnvironmentVariable($k, $v, 'Process')
          }
          $exe = Get-ChildItem tunnel\*.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "tunnel-runner exe missing"; exit 1 }
          Write-Host "Starting tunnel-runner: $($exe.FullName)"

          # Launch tunnel-runner — output to a file we tail into the workflow log.
          $args = "${{ inputs.debug_runner_args }}"
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList $args `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput tunnel-runner.log `
            -RedirectStandardError tunnel-runner.err
          Write-Host "tunnel-runner pid: $($proc.Id)"

          # Wait for the announcement so macwin's poller can pick it up.
          $announceDeadline = (Get-Date).AddMinutes(2)
          $announced = $false
          while ((Get-Date) -lt $announceDeadline) {
            if (Test-Path tunnel-runner.log) {
              $content = Get-Content tunnel-runner.log -ErrorAction SilentlyContinue
              if ($content -match "MACWIN_TUNNEL_ENDPOINT=") {
                Write-Host "═══ tunnel-runner announcement ═══"
                Write-Host ($content -join "`n")
                Write-Host "═══════════════════════════════════"
                $announced = $true
                break
              }
            }
            Start-Sleep -Seconds 2
          }
          if (-not $announced) {
            Write-Error "tunnel-runner did not announce within 2 minutes"
            Write-Host "tunnel-runner.log so far:"
            Get-Content tunnel-runner.log -ErrorAction SilentlyContinue
            Write-Host "tunnel-runner.err so far:"
            Get-Content tunnel-runner.err -ErrorAction SilentlyContinue
            exit 1
          }

          # Publish the announcement to the ephemeral release's body so macwin
          # can poll for it via the public GitHub REST API (gh's live-log API
          # doesn't return logs for in-progress jobs).
          $line = (Get-Content tunnel-runner.log | Where-Object { $_ -match "MACWIN_TUNNEL_ENDPOINT=" } | Select-Object -First 1)
          $endpoint = ($line -split " " | Where-Object { $_ -like "MACWIN_TUNNEL_ENDPOINT=*" } | Select-Object -First 1)
          if (-not $endpoint) { $endpoint = $line.Trim() }
          Write-Host "Publishing endpoint to release body: $endpoint"
          $editOut = gh release edit "${{ inputs.release }}" --notes "$endpoint" --repo "${{ github.repository }}" 2>&1
          Write-Host "gh release edit exit: $LASTEXITCODE"
          Write-Host "gh release edit output: $editOut"

          # Hold open until release sentinel or auto-timeout. The tunnel-runner
          # process stays alive for the duration since it's a child of THIS
          # powershell.
          Write-Host "═══ macwin debug runner ready ═══"
          Write-Host "Waiting for release sentinel at C:\macwin-release..."
          $deadline = (Get-Date).AddMinutes(26)
          while (-not (Test-Path C:\macwin-release)) {
            if ((Get-Date) -gt $deadline) {
              Write-Host "Auto-release after 26 minutes."
              break
            }
            # Periodic stream: forward new tunnel-runner stderr lines to the
            # workflow log so debug visibility is preserved.
            Start-Sleep -Seconds 30
          }
          Write-Host "Releasing runner."
          # Best-effort: stop the tunnel-runner cleanly.
          if (-not $proc.HasExited) { $proc.Kill() }

      # ----- One-shot path (debug=false) -----
      - name: Download binary from release
        if: ${{ inputs.debug != 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          gh release download "${{ inputs.release }}" --pattern '*.exe' --dir bin
      - name: Run + capture
        if: ${{ inputs.debug != 'true' }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem bin\*.exe | Select-Object -First 1
          $stdout = "stdout.log"
          $stderr = "stderr.log"
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList "${{ inputs.args }}" `
            -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $proc | Wait-Process
          "exit=$($proc.ExitCode)" | Out-File -FilePath exit.txt
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.debug != 'true' && always() }}
        with:
          name: macwin-result
          path: |
            stdout.log
            stderr.log
            exit.txt

  win-x86:
    if: ${{ inputs.target == 'win-x86' }}
    runs-on: windows-2022
    steps:
      - name: Download binary from release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          gh release download "${{ inputs.release }}" --pattern '*.exe' --dir bin
      - name: Run + capture
        shell: pwsh
        run: |
          $exe = Get-ChildItem bin\*.exe | Select-Object -First 1
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList "${{ inputs.args }}" `
            -PassThru -NoNewWindow -RedirectStandardOutput stdout.log -RedirectStandardError stderr.log
          $proc | Wait-Process
          "exit=$($proc.ExitCode)" | Out-File -FilePath exit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macwin-result
          path: |
            stdout.log
            stderr.log
            exit.txt

  linux-arm:
    if: ${{ inputs.target == 'linux-arm' || inputs.target == 'linux-arm-musl' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout source (debug)
        if: ${{ inputs.debug == 'true' }}
        uses: actions/checkout@v4

      - name: Download tunnel-runner from release (debug)
        if: ${{ inputs.debug == 'true' && inputs.release != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p tunnel
          gh release download "${{ inputs.release }}" --pattern '*macwin-tunnel-runner*' --dir tunnel
          chmod +x tunnel/macwin-tunnel-runner

      - name: Run tunnel-runner + hold open (debug)
        if: ${{ inputs.debug == 'true' && inputs.release != '' }}
        env:
          MACWIN_TUNNEL_SECRET: ${{ secrets.MACWIN_TUNNEL_SECRET }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          # Fan out env-vars blob → real env (newline-separated KEY=VALUE).
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            export "$line"
          done <<EOF_ENV
          ${{ inputs.debug_runner_env }}
          EOF_ENV

          # Background-launch tunnel-runner, capture stdout/stderr to a file.
          ./tunnel/macwin-tunnel-runner > tunnel-runner.log 2> tunnel-runner.err &
          TR_PID=$!
          echo "tunnel-runner pid: $TR_PID"

          # Wait for announcement.
          deadline=$(($(date +%s) + 120))
          while [ $(date +%s) -lt $deadline ]; do
            if grep -q "MACWIN_TUNNEL_ENDPOINT=" tunnel-runner.log 2>/dev/null; then
              echo "═══ tunnel-runner announcement ═══"
              cat tunnel-runner.log
              echo "═══════════════════════════════════"
              break
            fi
            sleep 2
          done
          ENDPOINT=$(grep "MACWIN_TUNNEL_ENDPOINT=" tunnel-runner.log | head -1 | tr -d '\r')
          if [ -z "$ENDPOINT" ]; then
            echo "tunnel-runner did not announce — logs follow:"
            cat tunnel-runner.log tunnel-runner.err
            exit 1
          fi
          gh release edit "${{ inputs.release }}" --notes "$ENDPOINT" --repo "${{ github.repository }}" || true

          echo "═══ macwin debug runner ready ═══"
          echo "Waiting for release sentinel at /tmp/macwin-release..."
          deadline=$(($(date +%s) + 26*60))
          while [ ! -f /tmp/macwin-release ]; do
            if [ $(date +%s) -gt $deadline ]; then
              echo "Auto-release after 26 minutes."
              break
            fi
            sleep 30
          done
          echo "Releasing runner."
          kill $TR_PID 2>/dev/null || true

      # ----- One-shot path -----
      - name: Download binary from release
        if: ${{ inputs.debug != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p bin
          gh release download "${{ inputs.release }}" --dir bin
      - name: Run + capture
        if: ${{ inputs.debug != 'true' }}
        run: |
          BIN=$(ls bin/* | head -1)
          chmod +x "$BIN"
          "$BIN" ${{ inputs.args }} >stdout.log 2>stderr.log
          echo "exit=$?" > exit.txt
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.debug != 'true' && always() }}
        with:
          name: macwin-result
          path: |
            stdout.log
            stderr.log
            exit.txt

  linux-x86:
    if: ${{ inputs.target == 'linux-x86' || inputs.target == 'linux-x86-musl' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download binary from release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p bin
          gh release download "${{ inputs.release }}" --dir bin
      - name: Run + capture
        run: |
          BIN=$(ls bin/* | head -1)
          chmod +x "$BIN"
          "$BIN" ${{ inputs.args }} >stdout.log 2>stderr.log
          echo "exit=$?" > exit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macwin-result
          path: |
            stdout.log
            stderr.log
            exit.txt

  mac-arm:
    if: ${{ inputs.target == 'mac-arm' }}
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout source (debug)
        if: ${{ inputs.debug == 'true' }}
        uses: actions/checkout@v4

      - name: Download tunnel-runner from release (debug)
        if: ${{ inputs.debug == 'true' && inputs.release != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p tunnel
          gh release download "${{ inputs.release }}" --pattern '*macwin-tunnel-runner*' --dir tunnel
          chmod +x tunnel/macwin-tunnel-runner

      - name: Run tunnel-runner + hold open (debug)
        if: ${{ inputs.debug == 'true' && inputs.release != '' }}
        env:
          MACWIN_TUNNEL_SECRET: ${{ secrets.MACWIN_TUNNEL_SECRET }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            export "$line"
          done <<EOF_ENV
          ${{ inputs.debug_runner_env }}
          EOF_ENV

          ./tunnel/macwin-tunnel-runner > tunnel-runner.log 2> tunnel-runner.err &
          TR_PID=$!
          echo "tunnel-runner pid: $TR_PID"

          deadline=$(($(date +%s) + 120))
          while [ $(date +%s) -lt $deadline ]; do
            if grep -q "MACWIN_TUNNEL_ENDPOINT=" tunnel-runner.log 2>/dev/null; then
              echo "═══ tunnel-runner announcement ═══"
              cat tunnel-runner.log
              echo "═══════════════════════════════════"
              break
            fi
            sleep 2
          done
          ENDPOINT=$(grep "MACWIN_TUNNEL_ENDPOINT=" tunnel-runner.log | head -1 | tr -d '\r')
          if [ -z "$ENDPOINT" ]; then
            echo "tunnel-runner did not announce — logs follow:"
            cat tunnel-runner.log tunnel-runner.err
            exit 1
          fi
          gh release edit "${{ inputs.release }}" --notes "$ENDPOINT" --repo "${{ github.repository }}" || true

          echo "═══ macwin debug runner ready ═══"
          echo "Waiting for release sentinel at /tmp/macwin-release..."
          deadline=$(($(date +%s) + 26*60))
          while [ ! -f /tmp/macwin-release ]; do
            if [ $(date +%s) -gt $deadline ]; then
              echo "Auto-release after 26 minutes."
              break
            fi
            sleep 30
          done
          echo "Releasing runner."
          kill $TR_PID 2>/dev/null || true

      # ----- One-shot path -----
      - name: Download binary from release
        if: ${{ inputs.debug != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p bin
          gh release download "${{ inputs.release }}" --dir bin
      - name: Run + capture
        if: ${{ inputs.debug != 'true' }}
        run: |
          BIN=$(ls bin/* | head -1)
          chmod +x "$BIN"
          "$BIN" ${{ inputs.args }} >stdout.log 2>stderr.log
          echo "exit=$?" > exit.txt
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.debug != 'true' && always() }}
        with:
          name: macwin-result
          path: |
            stdout.log
            stderr.log
            exit.txt
