[package]
name = "macwin-example"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
description = "macwin-example — cross-platform IPC daemon scaffolded by macwin"

[[bin]]
name = "macwin-example"
path = "src/main.rs"

[lib]
name = "macwin_example"
path = "src/lib.rs"

[dependencies]
# Cross-platform IPC: Windows named pipes + Unix domain sockets behind one
# unified API. Same code, every macwin target.
interprocess = "2"

[profile.release]
lto = "thin"
strip = true
